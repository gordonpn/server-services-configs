version: '3'

vars:
  ROOT_DIR: '{{.TASKFILE_DIR}}'
  CHARTS_DIR: '{{.ROOT_DIR}}/k8s/charts'
  TERRAFORM_DIR: '{{.ROOT_DIR}}/terraform'
  TF_BACKEND_ENDPOINT: '{{.TF_BACKEND_ENDPOINT | default "http://master.tailb65f8c.ts.net:30900"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task: help

  help:
    desc: List all tasks
    cmds:
      - task --list-all

  check:tools:
    desc: Check required CLI tools are installed
    cmds:
      - command -v docker
      - command -v kubectl
      - command -v helm
      - command -v helmfile
      - command -v terraform

  ci:lint:
    desc: Lint the Terraform workflow and its shell scripts
    cmds:
      - actionlint .github/workflows/terraform.yml
      - shellcheck scripts/ci/*.sh tests/*.sh tests/fixtures/*.sh

  tf:test:
    desc: Test backend credential guards without contacting infrastructure
    cmds:
      - bash tests/terraform-backend-credentials.sh

  ci:
    desc: Generate CI/CD config from jsonnet
    cmds:
      - drone jsonnet --format --stream

  script:backup:
    desc: Run backup script
    cmds:
      - bash scripts/backup.sh

  script:ddns:
    desc: Run DDNS start script
    cmds:
      - bash scripts/ddns-start

  script:deploy:
    desc: Run deployment script
    cmds:
      - bash scripts/deploy.sh

  script:rebalance:
    desc: Run force rebalance script
    cmds:
      - bash scripts/force_rebalance.sh

  script:ping:
    desc: Run ping healthcheck script
    cmds:
      - bash scripts/ping.sh

  script:trim-logs:
    desc: Trim logs
    cmds:
      - bash scripts/trim_logs.sh

  charts:build:
    desc: Build all Helmfile manifests
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml build

  charts:diff:
    desc: Diff Helmfile releases against cluster
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml diff

  charts:apply:
    desc: Apply all Helmfile releases
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml apply

  charts:destroy:
    desc: Destroy all Helmfile releases
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml destroy

  charts:template:
    desc: Render all Helmfile releases locally
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml template

  charts:lint:maintenance:
    desc: Lint local k3s-maintenance chart
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helm lint ./k3s-maintenance

  charts:lint:workloads:
    desc: Lint local workloads chart
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helm lint ./workloads

  charts:lint:all:
    desc: Lint all local charts
    cmds:
      - task: charts:lint:maintenance
      - task: charts:lint:workloads

  k8s:apply:network-health:
    desc: Apply network health checks from k3s-maintenance chart
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml --selector name=k3s-maintenance apply

  k8s:sync:workloads:
    desc: Sync the workloads Helmfile release
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml --selector name=workloads sync

  k8s:diff:workloads:
    desc: Diff the workloads Helmfile release against the cluster
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helmfile -f helmfile.yaml --selector name=workloads diff

  k8s:apply:all:
    desc: Apply all Kubernetes charts and workloads via Helmfile
    cmds:
      - task: charts:apply


  compose:up:
    desc: Start one docker-compose service directory (task compose:up SERVICE=jellyfin)
    preconditions:
      - sh: test -n '{{.SERVICE}}'
        msg: 'Set SERVICE, e.g. task compose:up SERVICE=jellyfin'
      - sh: test -f 'docker-compose/{{.SERVICE}}/docker-compose.yml'
        msg: 'Service docker-compose/{{.SERVICE}}/docker-compose.yml not found'
    cmds:
      - cd docker-compose/{{.SERVICE}} && docker compose up -d

  compose:down:
    desc: Stop one docker-compose service directory (task compose:down SERVICE=jellyfin)
    preconditions:
      - sh: test -n '{{.SERVICE}}'
        msg: 'Set SERVICE, e.g. task compose:down SERVICE=jellyfin'
      - sh: test -f 'docker-compose/{{.SERVICE}}/docker-compose.yml'
        msg: 'Service docker-compose/{{.SERVICE}}/docker-compose.yml not found'
    cmds:
      - cd docker-compose/{{.SERVICE}} && docker compose down

  compose:pull:
    desc: Pull images for one docker-compose service directory (task compose:pull SERVICE=jellyfin)
    preconditions:
      - sh: test -n '{{.SERVICE}}'
        msg: 'Set SERVICE, e.g. task compose:pull SERVICE=jellyfin'
      - sh: test -f 'docker-compose/{{.SERVICE}}/docker-compose.yml'
        msg: 'Service docker-compose/{{.SERVICE}}/docker-compose.yml not found'
    cmds:
      - cd docker-compose/{{.SERVICE}} && docker compose pull

  compose:logs:
    desc: Follow logs for one docker-compose service directory (task compose:logs SERVICE=jellyfin)
    preconditions:
      - sh: test -n '{{.SERVICE}}'
        msg: 'Set SERVICE, e.g. task compose:logs SERVICE=jellyfin'
      - sh: test -f 'docker-compose/{{.SERVICE}}/docker-compose.yml'
        msg: 'Service docker-compose/{{.SERVICE}}/docker-compose.yml not found'
    cmds:
      - cd docker-compose/{{.SERVICE}} && docker compose logs -f --tail=100

  swarm:deploy:
    desc: Deploy one swarm stack (task swarm:deploy STACK=traefik)
    preconditions:
      - sh: test -n '{{.STACK}}'
        msg: 'Set STACK, e.g. task swarm:deploy STACK=traefik'
      - sh: test -f 'docker-swarm/{{.STACK}}/docker-compose.yml'
        msg: 'Stack docker-swarm/{{.STACK}}/docker-compose.yml not found'
    cmds:
      - docker stack deploy -c docker-swarm/{{.STACK}}/docker-compose.yml {{.STACK}}

  swarm:remove:
    desc: Remove one swarm stack (task swarm:remove STACK=traefik)
    preconditions:
      - sh: test -n '{{.STACK}}'
        msg: 'Set STACK, e.g. task swarm:remove STACK=traefik'
    cmds:
      - docker stack rm {{.STACK}}

  swarm:ls:
    desc: List swarm stacks
    cmds:
      - docker stack ls

  swarm:services:
    desc: List services in one swarm stack (task swarm:services STACK=traefik)
    preconditions:
      - sh: test -n '{{.STACK}}'
        msg: 'Set STACK, e.g. task swarm:services STACK=traefik'
    cmds:
      - docker stack services {{.STACK}}

  tf:init:
    desc: Initialize terraform
    dir: '{{.TERRAFORM_DIR}}'
    env: &backend_credentials
      AWS_ACCESS_KEY_ID: '{{.AWS_ACCESS_KEY_ID}}'
      AWS_SECRET_ACCESS_KEY: '{{.AWS_SECRET_ACCESS_KEY}}'
    preconditions: &backend_credential_checks
      - sh: test -n "$AWS_ACCESS_KEY_ID"
        msg: Export AWS_ACCESS_KEY_ID from secure local storage or CI secrets
      - sh: test -n "$AWS_SECRET_ACCESS_KEY"
        msg: Export AWS_SECRET_ACCESS_KEY from secure local storage or CI secrets
    cmds:
      - terraform init -backend-config="endpoint={{.TF_BACKEND_ENDPOINT}}" {{.CLI_ARGS}}

  tf:fmt:
    desc: Format terraform files
    dir: '{{.TERRAFORM_DIR}}'
    cmds:
      - terraform fmt -recursive {{.CLI_ARGS}}

  tf:validate:
    desc: Validate terraform config
    dir: '{{.TERRAFORM_DIR}}'
    cmds:
      - terraform validate {{.CLI_ARGS}}

  tf:plan:
    desc: Plan terraform changes
    dir: '{{.TERRAFORM_DIR}}'
    env: *backend_credentials
    preconditions: *backend_credential_checks
    cmds:
      - terraform plan {{.CLI_ARGS}}

  tf:apply:
    desc: Apply terraform changes
    dir: '{{.TERRAFORM_DIR}}'
    env: *backend_credentials
    preconditions: *backend_credential_checks
    cmds:
      - terraform apply {{.CLI_ARGS}}

  tf:destroy:
    desc: Destroy terraform-managed resources
    dir: '{{.TERRAFORM_DIR}}'
    env: *backend_credentials
    preconditions: *backend_credential_checks
    cmds:
      - terraform destroy {{.CLI_ARGS}}
