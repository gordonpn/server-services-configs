#!/usr/sbin/nft -f

table inet host_firewall {}
delete table inet host_firewall

table inet host_firewall {
    chain input {
        type filter hook input priority filter - 1; policy drop;

        # Accept established and related connections
        ct state established,related accept

        # Drop invalid connection states
        ct state invalid drop

        # Accept loopback traffic
        iifname "lo" accept

        # Accept all traffic arriving via the private Tailscale WireGuard mesh
        iifname "tailscale0" accept

        # Accept internal traffic from Docker and Kubernetes virtual interfaces
        iifname "docker_gwbridge" accept
        iifname "docker0" accept
        iifname "flannel.1" accept
        iifname "cni0" accept

        # Accept Tailscale WireGuard UDP tunnels on public interface
        iifname "eth0" udp dport 41641 accept

        # Accept ICMP (IPv4 ping and diagnostic control messages)
        meta l4proto icmp accept

        # Accept ICMPv6 (IPv6 ping, neighbor discovery, and diagnostic messages)
        meta l4proto ipv6-icmp accept
    }
}
