name: Terraform GitOps

on:
  push:
    branches:
      - master
    paths:
      - 'terraform/**'
      - 'Taskfile.yaml'
      - 'scripts/ci/**'
  pull_request:
    branches:
      - master
    paths:
      - 'terraform/**'
      - 'Taskfile.yaml'
      - 'scripts/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  terraform:
    name: Terraform Reconcile
    runs-on: home-lab-runners
    timeout-minutes: 15
    env:
      GODEBUG: "netdns=cgo"
      TF_BACKEND_ENDPOINT: "http://minio.longhorn-system.svc.cluster.local:9000"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadminsecret"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      TF_VAR_account_id: ${{ secrets.TF_VAR_ACCOUNT_ID }}
      TF_VAR_kuma_password: ${{ secrets.TF_VAR_KUMA_PASSWORD }}
      TF_VAR_kuma_slack_webhook_url: ${{ secrets.TF_VAR_KUMA_SLACK_WEBHOOK_URL }}
      TF_VAR_healthchecksio_api_key: ${{ secrets.TF_VAR_HEALTHCHECKSIO_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prefer IPv4 Networking
        run: ./scripts/ci/prefer-ipv4.sh

      - name: Setup Task
        run: ./scripts/ci/setup-task.sh

      - name: Setup OpenTofu
        run: ./scripts/ci/setup-tofu.sh

      - name: Terraform Fmt Check
        run: task tf:fmt -- -check

      - name: Terraform Init
        run: task tf:init

      - name: Terraform Validate
        run: task tf:validate

      - name: Terraform Plan
        run: task tf:plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: task tf:apply -- -auto-approve
