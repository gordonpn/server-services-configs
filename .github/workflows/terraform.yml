name: Terraform GitOps

on:
  push:
    branches:
      - master
    paths:
      - 'terraform/**'
      - 'Taskfile.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'terraform/**'
      - 'Taskfile.yaml'
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Reconcile
    runs-on: home-lab-runners
    env:
      GODEBUG: "netdns=cgo"
      TF_BACKEND_ENDPOINT: "http://minio.longhorn-system.svc.cluster.local:9000"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadminsecret"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      TF_VAR_account_id: ${{ secrets.TF_VAR_ACCOUNT_ID }}
      TF_VAR_kuma_password: ${{ secrets.TF_VAR_KUMA_PASSWORD }}
      TF_VAR_kuma_slack_webhook_url: ${{ secrets.TF_VAR_KUMA_SLACK_WEBHOOK_URL }}
      TF_VAR_healthchecksio_api_key: ${{ secrets.TF_VAR_HEALTHCHECKSIO_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prefer IPv4 Networking
        run: |
          set -eo pipefail
          echo "precedence ::ffff:0:0/96 100" | sudo tee /etc/gai.conf || true

      - name: Setup Task
        run: |
          set -eo pipefail
          TASK_VERSION="3.52.0"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --fail "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_${ARCH}.tar.gz" -o /tmp/task.tar.gz
          tar -zxf /tmp/task.tar.gz -C $HOME/.local/bin task
          rm -f /tmp/task.tar.gz
          chmod +x $HOME/.local/bin/task
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OpenTofu
        run: |
          set -eo pipefail
          TOFU_VERSION="1.9.0"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --fail "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_${ARCH}.tar.gz" -o /tmp/tofu.tar.gz
          tar -zxf /tmp/tofu.tar.gz -C $HOME/.local/bin tofu
          rm -f /tmp/tofu.tar.gz
          chmod +x $HOME/.local/bin/tofu
          ln -sf $HOME/.local/bin/tofu $HOME/.local/bin/terraform
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Terraform Fmt Check
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          task tf:fmt -- -check

      - name: Terraform Init
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          task tf:init

      - name: Terraform Validate
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          task tf:validate

      - name: Terraform Plan
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          task tf:plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          task tf:apply -- -auto-approve
