name: GitOps Loop

on:
  push:
    branches:
      - master
    paths:
      - 'k8s/**'
      - 'Taskfile.yaml'
      - '.github/workflows/gitops.yml'
  workflow_dispatch:

jobs:
  gitops:
    name: Sync GitOps Releases
    runs-on: home-lab-runners
    env:
      GODEBUG: "netdns=cgo"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Prefer IPv4 Networking
        run: |
          set -eo pipefail
          echo "precedence ::ffff:0:0/96 100" | sudo tee /etc/gai.conf || true

      - name: Setup Task
        run: |
          set -eo pipefail
          TASK_VERSION="3.52.0"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --fail "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_${ARCH}.tar.gz" -o /tmp/task.tar.gz
          tar -zxf /tmp/task.tar.gz -C $HOME/.local/bin task
          rm -f /tmp/task.tar.gz
          chmod +x $HOME/.local/bin/task
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Kubectl
        run: |
          set -eo pipefail
          KUBECTL_VERSION="v1.34.3"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --fail "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl" -o $HOME/.local/bin/kubectl
          chmod +x $HOME/.local/bin/kubectl
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Helm
        run: |
          set -eo pipefail
          HELM_VERSION="v4.3.1"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --fail "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz" -o /tmp/helm.tar.gz
          tar -zxf /tmp/helm.tar.gz --strip-components=1 -C $HOME/.local/bin linux-${ARCH}/helm
          rm -f /tmp/helm.tar.gz
          chmod +x $HOME/.local/bin/helm
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Helm Diff Plugin
        run: |
          set -eo pipefail
          DIFF_VERSION="3.15.12"
          if ! $HOME/.local/bin/helm plugin list | awk -v ver="$DIFF_VERSION" 'NR > 1 && $1 == "diff" && $2 == ver { found = 1 } END { exit !found }'; then
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then
              ARCH="amd64"
              DIFF_SHA256="977f92cd82269585a3ee7744d646462142333bb0be573fd8be0c983973175fc7"
            elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
              ARCH="arm64"
              DIFF_SHA256="c3d240d4b284b57b6ab76bbfe47ac84edbf0de239f15c4ff759152fa2b7777f8"
            else
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
            fi
            curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --fail "https://github.com/databus23/helm-diff/releases/download/v${DIFF_VERSION}/helm-diff-linux-${ARCH}.tgz" -o /tmp/helm-diff.tgz
            echo "${DIFF_SHA256}  /tmp/helm-diff.tgz" | sha256sum -c -
            PLUGIN_DIR="$($HOME/.local/bin/helm env HELM_PLUGINS)"
            mkdir -p "$PLUGIN_DIR"
            rm -rf "$PLUGIN_DIR/diff" "$PLUGIN_DIR/helm-diff"
            tar -zxf /tmp/helm-diff.tgz -C "$PLUGIN_DIR"
            rm -f /tmp/helm-diff.tgz
          fi

      - name: Setup Helmfile
        run: |
          set -eo pipefail
          HELMFILE_VERSION="1.8.2"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 3 --retry-connrefused --fail "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_${ARCH}.tar.gz" -o /tmp/helmfile.tar.gz
          tar -zxf /tmp/helmfile.tar.gz -C $HOME/.local/bin helmfile
          rm -f /tmp/helmfile.tar.gz
          chmod +x $HOME/.local/bin/helmfile
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Apply Charts via Helmfile
        run: |
          set -eo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          task charts:apply || (sleep 5 && task charts:apply)
