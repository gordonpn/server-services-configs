name: GitOps Loop

on:
  push:
    branches:
      - master
    paths:
      - 'k8s/**'
      - 'Taskfile.yaml'
  workflow_dispatch:

jobs:
  gitops:
    name: Sync GitOps Releases
    runs-on: home-lab-runners
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Task
        run: |
          TASK_VERSION="3.52.0"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 2 "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_${ARCH}.tar.gz" | tar -zxf - -C $HOME/.local/bin task
          chmod +x $HOME/.local/bin/task
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.3'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.19.4'

      - name: Install Helm Diff Plugin
        run: |
          helm plugin install https://github.com/databus23/helm-diff --version v3.14.1 || true

      - name: Setup Helmfile
        run: |
          HELMFILE_VERSION="1.2.3"
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          mkdir -p $HOME/.local/bin
          curl -sSL --retry 5 --retry-delay 2 "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_${ARCH}.tar.gz" | tar -zxf - -C $HOME/.local/bin helmfile
          chmod +x $HOME/.local/bin/helmfile
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Apply Charts via Helmfile
        run: task charts:apply
