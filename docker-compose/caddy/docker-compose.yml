services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    networks:
      - vps_shield_net
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    networks:
      - vps_shield_net
    environment:
      - TUNNEL_TOKEN=${VPS_TUNNEL_TOKEN:-}

networks:
  vps_shield_net:

volumes:
  caddy_data:
  caddy_config:
