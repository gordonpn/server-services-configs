version: '3.8'

services:
  kuma-swarm-pusher:
    image: alpine:latest
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - MASTER_TOKEN=${KUMA_SWARM_TOKEN_MASTER}
      - PI_BOS_0_TOKEN=${KUMA_SWARM_TOKEN_PI_BOS_0}
      - PI_MTL_0_TOKEN=${KUMA_SWARM_TOKEN_PI_MTL_0}
      - PI_MTL_1_TOKEN=${KUMA_SWARM_TOKEN_PI_MTL_1}
      - RACKNERD_EDC1BC8_TOKEN=${KUMA_SWARM_TOKEN_RACKNERD_EDC1BC8}
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
    command:
      - sh
      - -c
      - |
        NODE_NAME=$$(cat /etc/host_hostname)
        while true; do
          VAR_NAME=$$(echo "$$NODE_NAME" | tr '[:lower:]-' '[:upper:]_')_TOKEN
          eval TOKEN=\$$VAR_NAME

          if [ -n "$$TOKEN" ]; then
            wget -q -O- -T 5 -t 3 "https://p01--uptime-kuma--m5z2j5q8x7zn.code.run/api/push/$${TOKEN}?status=up&msg=Swarm+Active" || true
          fi
          sleep 30
        done
