version: '3.8'

services:
  kuma-swarm-pusher:
    image: alpine:latest
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - MASTER_TOKEN=${KUMA_SWARM_TOKEN_MASTER}
      - PI_BOS_0_TOKEN=${KUMA_SWARM_TOKEN_PI_BOS_0}
      - PI_MTL_0_TOKEN=${KUMA_SWARM_TOKEN_PI_MTL_0}
      - PI_MTL_1_TOKEN=${KUMA_SWARM_TOKEN_PI_MTL_1}
    volumes:
      - /etc/hostname:/etc/host_hostname:ro
    command: >
      sh -c "
      apk add --no-cache curl &&
      NODE_NAME=\$(cat /etc/host_hostname) &&
      while true; do
        case \"\$NODE_NAME\" in
          \"master\")   TOKEN=\"\$MASTER_TOKEN\" ;;
          \"pi-bos-0\") TOKEN=\"\$PI_BOS_0_TOKEN\" ;;
          \"pi-mtl-0\") TOKEN=\"\$PI_MTL_0_TOKEN\" ;;
          \"pi-mtl-1\") TOKEN=\"\$PI_MTL_1_TOKEN\" ;;
          *)            TOKEN=\"\" ;;
        esac

        if [ -n \"\$TOKEN\" ]; then
          curl -fsS --retry 3 \"https://p01--uptime-kuma--m5z2j5q8x7zn.code.run/api/push/\${TOKEN}?status=up&msg=Swarm+Active\" || true
        fi
        sleep 60
      done
      "
