apiVersion: batch/v1
kind: CronJob
metadata:
  name: network-health-check
  namespace: kube-system
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: network-check
            image: busybox
            command:
            - /bin/sh
            - -c
            - |
              nslookup kubernetes.default || exit 1
              wget -T 5 -O- http://kubernetes.default/healthz || exit 1
          restartPolicy: OnFailure
