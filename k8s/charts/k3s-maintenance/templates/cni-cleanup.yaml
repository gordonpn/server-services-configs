apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cni-cleanup
  namespace: kube-system
  labels:
    app: cni-cleanup
spec:
  selector:
    matchLabels:
      app: cni-cleanup
  template:
    metadata:
      labels:
        app: cni-cleanup
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: cleaner
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            echo "Checking for stale CNI lock files..."
            find /var/lib/cni/networks -name "lock" -mmin +60 -exec rm -v {} \;
            sleep 3600
          done
        volumeMounts:
        - name: cni-data
          mountPath: /var/lib/cni/networks
      volumes:
      - name: cni-data
        hostPath:
          path: /var/lib/cni/networks
