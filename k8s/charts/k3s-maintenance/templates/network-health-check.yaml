apiVersion: v1
kind: Service
metadata:
  name: {{ include "k3s-maintenance.networkHealth.echoServiceName" . }}
  namespace: kube-system
spec:
  selector:
    app: {{ include "k3s-maintenance.networkHealth.echoAppLabel" . }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "k3s-maintenance.networkHealth.echoDaemonSetName" . }}
  namespace: kube-system
  labels:
    app: {{ include "k3s-maintenance.networkHealth.echoAppLabel" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "k3s-maintenance.networkHealth.echoAppLabel" . }}
  template:
    metadata:
      labels:
        app: {{ include "k3s-maintenance.networkHealth.echoAppLabel" . }}
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:8080
            - -text=ok
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "k3s-maintenance.networkHealth.healthCheckCronJobName" . }}
  namespace: kube-system
spec:
  schedule: "*/5 * * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          tolerations:
            - operator: Exists
          containers:
            - name: network-check
              image: busybox:1.36
              command:
                - /bin/sh
                - -ec
                - |
                  nslookup kubernetes.default.svc.cluster.local
                  nslookup kube-dns.kube-system.svc.cluster.local
                  nc -z -w5 kubernetes.default.svc 443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k3s-maintenance.networkHealth.crossNodeCheckerName" . }}
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k3s-maintenance.networkHealth.crossNodeCheckerName" . }}
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k3s-maintenance.networkHealth.crossNodeCheckerName" . }}
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k3s-maintenance.networkHealth.crossNodeCheckerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k3s-maintenance.networkHealth.crossNodeCheckerName" . }}
    namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "k3s-maintenance.networkHealth.crossNodeCheckCronJobName" . }}
  namespace: kube-system
spec:
  schedule: "*/10 * * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: {{ include "k3s-maintenance.networkHealth.crossNodeCheckerName" . }}
          restartPolicy: OnFailure
          tolerations:
            - operator: Exists
          containers:
            - name: discover-target
              image: "{{ .Values.networkHealth.discoverTarget.image.repository }}:{{ .Values.networkHealth.discoverTarget.image.tag }}"
              imagePullPolicy: {{ .Values.networkHealth.discoverTarget.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  echo "Discovering target echo pod on other nodes..."
                  # Get all running echo pods not on the current node
                  TARGETS="$(kubectl get pods -n kube-system -l app={{ include "k3s-maintenance.networkHealth.echoAppLabel" . }} -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.status.podIP} {.spec.nodeName}{"\n"}{end}' | awk -v node="$MY_NODE_NAME" '$2 != node {print $1}')"
                  
                  if [ -z "$TARGETS" ]; then
                    echo "No remote target found. Checking if we are in a single-node cluster..."
                    TOTAL_ECHO_PODS="$(kubectl get pods -n kube-system -l app={{ include "k3s-maintenance.networkHealth.echoAppLabel" . }} --no-headers | wc -l)"
                    if [ "$TOTAL_ECHO_PODS" -le 1 ]; then
                      echo "NO_TARGET" > /shared/target_ip
                      exit 0
                    fi
                    echo "Error: Echo pods exist but none are Running on other nodes."
                    exit 1
                  fi
                  
                  # Save all potential targets, one per line
                  echo "$TARGETS" > /shared/target_ip
              env:
                - name: MY_NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              volumeMounts:
                - name: shared
                  mountPath: /shared
            - name: check-crossnode
              image: busybox:1.36
              command:
                - /bin/sh
                - -ec
                - |
                  echo "Waiting for target discovery..."
                  for i in $(seq 1 60); do
                    if [ -s /shared/target_ip ]; then
                      break
                    fi
                    sleep 1
                  done

                  if [ ! -s /shared/target_ip ]; then
                    echo "Error: No target discovered by helper container after 60s"
                    exit 1
                  fi

                  TARGETS="$(cat /shared/target_ip)"
                  if [ "$TARGETS" = "NO_TARGET" ]; then
                    echo "No non-local echo pod found; likely single-node cluster. Skipping cross-node check."
                    exit 0
                  fi

                  # Try each target until one succeeds
                  SUCCESS=0
                  for ip in $TARGETS; do
                    echo "Checking connectivity to $ip:8080..."
                    # Try wget with 3 retries and 5s timeout
                    for retry in 1 2 3; do
                      RESPONSE="$(wget -q -T 5 -O- "http://${ip}:8080" 2>/dev/null || true)"
                      if echo "$RESPONSE" | grep -q "ok"; then
                        echo "Successfully reached $ip:8080"
                        SUCCESS=1
                        break 2
                      fi
                      echo "Retry $retry failed for $ip..."
                      sleep 2
                    done
                  done

                  if [ $SUCCESS -ne 1 ]; then
                    echo "Error: Failed to reach any remote echo pod"
                    exit 1
                  fi
              volumeMounts:
                - name: shared
                  mountPath: /shared
          volumes:
            - name: shared
              emptyDir: {}
