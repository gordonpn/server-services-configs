apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kuma-k3s-pusher
  namespace: kube-system
  labels:
    app: kuma-k3s-pusher
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: kuma-k3s-pusher
  template:
    metadata:
      labels:
        app: kuma-k3s-pusher
    spec:
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: pusher
          image: busybox:1.36
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MASTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: master
            - name: PI_BOS_0_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: pi-bos-0
            - name: PI_MTL_0_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: pi-mtl-0
            - name: PI_MTL_1_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: pi-mtl-1
            - name: RACKNERD_EDC1BC8_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: racknerd-edc1bc8
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                case "$MY_NODE_NAME" in
                  "master")           TOKEN="$MASTER_TOKEN" ;;
                  "pi-bos-0")         TOKEN="$PI_BOS_0_TOKEN" ;;
                  "pi-mtl-0")         TOKEN="$PI_MTL_0_TOKEN" ;;
                  "pi-mtl-1")         TOKEN="$PI_MTL_1_TOKEN" ;;
                  "racknerd-edc1bc8") TOKEN="$RACKNERD_EDC1BC8_TOKEN" ;;
                  *)                  TOKEN="" ;;
                esac

                if [ -n "$TOKEN" ]; then
                  # Retry internal health check up to 3 times before skipping the ping
                  CHECK_SUCCESS=false
                  for i in 1 2 3; do
                    if nslookup kubernetes.default.svc.cluster.local >/dev/null 2>&1 && nc -z -w3 kubernetes.default.svc 443 >/dev/null 2>&1; then
                      CHECK_SUCCESS=true
                      break
                    fi
                    sleep 2
                  done

                  if [ "$CHECK_SUCCESS" = "true" ]; then
                    wget -q -O- -T 5 -t 3 "https://p01--uptime-kuma--m5z2j5q8x7zn.code.run/api/push/${TOKEN}?status=up&msg=K3s+Ready" || true
                  else
                    echo "Internal checks failed on node $MY_NODE_NAME (DNS or API server unreachable)"
                  fi
                fi
                sleep 30
              done
