apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kuma-k3s-pusher
  namespace: kube-system
  labels:
    app: kuma-k3s-pusher
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: kuma-k3s-pusher
  template:
    metadata:
      labels:
        app: kuma-k3s-pusher
    spec:
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: pusher
          image: busybox:1.36
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MASTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: master
            - name: PI_BOS_0_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: pi-bos-0
            - name: PI_MTL_0_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: pi-mtl-0
            - name: PI_MTL_1_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: pi-mtl-1
            - name: RACKNERD_EDC1BC8_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuma-k3s-tokens
                  key: racknerd-edc1bc8
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                VAR_NAME=$(echo "$MY_NODE_NAME" | tr '[:lower:]-' '[:upper:]_')_TOKEN
                eval TOKEN=\$$VAR_NAME

                if [ -n "$TOKEN" ]; then
                  wget -q -O- -T 5 -t 3 "https://p01--uptime-kuma--m5z2j5q8x7zn.code.run/api/push/${TOKEN}?status=up&msg=K3s+Ready" || true
                fi
                sleep 15
              done
