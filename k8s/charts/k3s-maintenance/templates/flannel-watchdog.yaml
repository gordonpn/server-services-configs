apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flannel-watchdog
  namespace: kube-system
  labels:
    app: flannel-watchdog
spec:
  selector:
    matchLabels:
      app: flannel-watchdog
  template:
    metadata:
      labels:
        app: flannel-watchdog
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: watchdog
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              echo "Flannel VXLAN Overlay Watchdog started."
              # Wait 2 minutes on initial boot to let services settle
              sleep 120
              while true; do
                nsenter --target 1 --mount --uts --ipc --net --pid -- /bin/sh -c '
                  # Only run recovery on nodes running K3s
                  if systemctl is-active --quiet k3s-agent || systemctl is-active --quiet k3s; then
                    # Check if Tailscale interface exists and is up
                    if ip link show tailscale0 >/dev/null 2>&1; then
                      # Check if Flannel overlay interface is missing
                      if ! ip link show flannel.1 >/dev/null 2>&1; then
                        echo "[$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")] Flannel overlay interface (flannel.1) missing while tailscale0 is UP! Initiating recovery restart..."
                        if systemctl is-active --quiet k3s-agent; then
                          systemctl restart k3s-agent
                        elif systemctl is-active --quiet k3s; then
                          systemctl restart k3s
                        fi
                        echo "[$(date -u +\"%Y-%m-%dT%H:%M:%SZ\")] Recovery restart completed. Entering 5-minute cooldown."
                        sleep 300
                      fi
                    fi
                  fi
                '
                sleep 60
              done
