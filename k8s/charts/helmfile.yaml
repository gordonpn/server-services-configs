repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: actions-runner-controller
    url: https://actions-runner-controller.github.io/actions-runner-controller
  - name: longhorn
    url: https://charts.longhorn.io
  - name: sealed-secrets
    url: https://raw.githubusercontent.com/bitnami-labs/sealed-secrets/gh-pages
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  - name: mon
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 81.2.2
    values:
      - values-monitor.yaml

  - name: pushgateway
    namespace: monitoring
    chart: prometheus-community/prometheus-pushgateway
    version: 3.6.0
    values:
      - values-pushgateway.yaml

  - name: loki
    namespace: monitoring
    chart: grafana/loki
    version: 7.3.0
    values:
      - values-loki.yaml

  - name: promtail
    namespace: monitoring
    chart: grafana/promtail
    version: 6.17.1
    needs:
      - monitoring/loki
    values:
      - values-promtail.yaml

  - name: longhorn
    namespace: longhorn-system
    chart: longhorn/longhorn
    version: 1.10.1
    needs:
      - kube-system/k3s-maintenance
    values:
      - values-longhorn.yaml

  - name: sealed-secrets
    namespace: kube-system
    chart: sealed-secrets/sealed-secrets
    version: 2.18.0
    values:
      - values-sealed-secrets.yaml

  - name: arc-controller
    namespace: actions-runner-system
    chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    version: 0.13.1
    values:
      - metrics:
          controllerManagerAddr: ":8080"
          listenerAddr: ":8080"
          listenerEndpoint: "/metrics"
      - flags:
          logLevel: "debug"

  - name: arc-runner-set
    namespace: actions-runner-system
    chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    version: 0.13.1
    needs:
      - actions-runner-system/arc-controller
    values:
      - githubConfigUrl: "https://github.com/gordonpn/server-services-configs"
      - githubConfigSecret: "github-actions-runner-token"
      - minRunners: 1
      - maxRunners: 5
      - runnerScaleSetName: "home-lab-runners"
      - controllerServiceAccount:
          namespace: actions-runner-system
          name: arc-controller-gha-rs-controller
      - template:
          spec:
            serviceAccountName: home-lab-runner
            nodeSelector:
              kubernetes.io/hostname: master
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
                - name: single-request-reopen
            containers:
              - name: runner
                image: "ghcr.io/actions/actions-runner:latest"
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOTNET_SYSTEM_NET_DISABLEIPV6
                    value: "1"
                  - name: NODE_OPTIONS
                    value: "--dns-result-order=ipv4first"
                  - name: GODEBUG
                    value: "netdns=cgo"

  - name: arc-runner-set-scraper
    namespace: actions-runner-system
    chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    version: 0.13.1
    needs:
      - actions-runner-system/arc-controller
    values:
      - githubConfigUrl: "https://github.com/gordonpn/lectures-on-tap-scraper"
      - githubConfigSecret: "github-actions-runner-token-scraper"
      - minRunners: 1
      - maxRunners: 3
      - runnerScaleSetName: "home-lab-runners-scraper"
      - controllerServiceAccount:
          namespace: actions-runner-system
          name: arc-controller-gha-rs-controller
      - template:
          spec:
            serviceAccountName: home-lab-runner
            nodeSelector:
              kubernetes.io/hostname: master
            dnsConfig:
              options:
                - name: ndots
                  value: "1"
                - name: single-request-reopen
            containers:
              - name: runner
                image: "ghcr.io/actions/actions-runner:latest"
                command: ["/home/runner/run.sh"]
                env:
                  - name: DOTNET_SYSTEM_NET_DISABLEIPV6
                    value: "1"
                  - name: NODE_OPTIONS
                    value: "--dns-result-order=ipv4first"
                  - name: GODEBUG
                    value: "netdns=cgo"

  - name: k3s-maintenance
    namespace: kube-system
    chart: ./k3s-maintenance

