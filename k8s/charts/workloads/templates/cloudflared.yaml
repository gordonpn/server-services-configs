{{- $validProtocols := list "auto" "http2" "quic" -}}
{{- $protocol := .Values.cloudflared.protocol | default "http2" -}}
{{- if not (has $protocol $validProtocols) -}}
{{- fail (printf "cloudflared.protocol must be one of [%s], got %q" ($validProtocols | join ", ") $protocol) -}}
{{- end -}}
{{- $validEdgeIpVersions := list "4" "6" "auto" -}}
{{- $edgeIpVersion := .Values.cloudflared.edgeIpVersion | default "4" | toString -}}
{{- if not (has $edgeIpVersion $validEdgeIpVersions) -}}
{{- fail (printf "cloudflared.edgeIpVersion must be one of [%s], got %q" ($validEdgeIpVersions | join ", ") $edgeIpVersion) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app: cloudflared
spec:
  replicas: {{ .Values.cloudflared.replicas | default 4 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      nodeSelector:
        kubernetes.io/hostname: master
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy | default "IfNotPresent" }}
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - --no-autoupdate
            - --edge-ip-version
            - {{ $edgeIpVersion | quote }}
            - --protocol
            - {{ $protocol | quote }}
            - run
            - --token
            - "$(TUNNEL_TOKEN)"
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
