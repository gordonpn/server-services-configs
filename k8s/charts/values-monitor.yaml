alertmanager:
  alertmanagerSpec:
    externalUrl: http://master.tailb65f8c.ts.net:30093
    secrets:
    - alertmanager-slack-creds
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: longhorn
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-creds/slack_api_url
    receivers:
    - name: slack
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-creds/slack_api_url
        channel: '#homelab-alerts'
        send_resolved: true
        text: |-
          {{ range .Alerts }}• {{ .Annotations.summary }}
          {{ end }}
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
    route:
      group_by:
      - alertname
      - namespace
      - pod
      - instance
      group_interval: 5m
      group_wait: 30s
      receiver: slack
      repeat_interval: 4h
  service:
    nodePort: 30093
    type: NodePort
grafana:
  persistence:
    annotations:
      "helm.sh/resource-policy": keep
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClassName: longhorn
  service:
    nodePort: 30000
    type: NodePort
  sidecar:
    datasources:
      defaultDatasourceEnabled: true
      enabled: true
      isDefaultDatasource: true
      uid: prometheus
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
  service:
    nodePort: 30090
    type: NodePort
