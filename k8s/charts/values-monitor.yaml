alertmanager:
  alertmanagerSpec:
    externalUrl: http://master.tailb65f8c.ts.net:30093
    nodeSelector:
      kubernetes.io/hostname: master
    secrets:
    - alertmanager-slack-creds
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: longhorn-master
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-creds/slack_api_url
    receivers:
    - name: 'null'
    - name: slack
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-creds/slack_api_url
        channel: '#homelab-alerts'
        send_resolved: true
        text: |-
          {{ range .Alerts }}• [{{ or .Labels.namespace "unknown-namespace" }}/{{ or .Labels.job_name .Labels.job "unknown-job" }}] {{ .Annotations.summary }}
            Started: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}{{ if eq .Status "resolved" }} | Ended: {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}{{ end }}
          {{ end }}
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
    route:
      group_by:
      - alertname
      - namespace
      - job_name
      group_interval: 5m
      group_wait: 30s
      receiver: slack
      repeat_interval: 4h
      routes:
      - match_re:
          alertname: ^(Watchdog|InfoInhibitor)$
        receiver: 'null'
      - match:
          alertname: KubeJobFailed
        receiver: slack
        group_interval: 30m
        repeat_interval: 8h
      - match_re:
          alertname: ^(CoreDNS.*|DNSResolutionFailing|KubePodCrashLooping)
        receiver: slack
    inhibit_rules:
    - target_match_re:
        alertname: ^(KubePodNotReady|KubePodCrashLooping|KubeContainerWaiting|TargetDown|KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck)$
      source_match_re:
        alertname: ^(KubeNodeNotReady|KubeNodeUnreachable|KubeletDown)$
      equal:
        - node
        - instance
    - target_match_re:
        alertname: ^(KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck|KubeStateMetricsListErrors)$
      source_match:
        alertname: KubeAPIDown
  service:
    nodePort: 30093
    type: NodePort
grafana:
  nodeSelector:
    kubernetes.io/hostname: master
  persistence:
    annotations:
      "helm.sh/resource-policy": keep
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClassName: longhorn-master
  service:
    nodePort: 30000
    type: NodePort
  sidecar:
    datasources:
      defaultDatasourceEnabled: true
      enabled: true
      isDefaultDatasource: true
      uid: prometheus
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: master
  admissionWebhooks:
    patch:
      nodeSelector:
        kubernetes.io/hostname: master
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GiB
    tsdb:
      outOfOrderTimeWindow: 30m
    securityContext:
      fsGroupChangePolicy: "OnRootMismatch"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn-master
    nodeSelector:
      kubernetes.io/hostname: master
  service:
    nodePort: 30090
    type: NodePort

additionalPrometheusRulesMap:
  coredns-rules:
    groups:
    - name: coredns
      interval: 30s
      rules:
      - alert: CoreDNSDown
        expr: sum(up{job="kube-dns"}) < 1
        for: 2m
        labels:
          severity: critical
          namespace: kube-system
          job_name: kube-dns
        annotations:
          summary: "CoreDNS is down"
          description: "CoreDNS has been down for more than 2 minutes."
      - alert: CoreDNSHighErrorRate
        expr: |
          (
            sum(rate(coredns_dns_responses_total{rcode="SERVFAIL"}[15m]) OR on() vector(0))
              /
            sum(rate(coredns_dns_responses_total[15m]) OR on() vector(0))
          ) > 0.05
          and
          sum(rate(coredns_dns_responses_total[15m]) OR on() vector(0)) > 100
        for: 5m
        labels:
          severity: warning
          namespace: kube-system
          job_name: kube-dns
          job: kube-dns
        annotations:
          summary: "CoreDNS high error rate"
          description: "CoreDNS SERVFAIL rate is >5% (current: {{ $value | humanizePercentage }})."
