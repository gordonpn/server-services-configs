alertmanager:
  alertmanagerSpec:
    externalUrl: http://master.tailb65f8c.ts.net:30093
    secrets:
    - alertmanager-slack-creds
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: longhorn
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-creds/slack_api_url
    receivers:
    - name: 'null'
    - name: slack
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-creds/slack_api_url
        channel: '#homelab-alerts'
        send_resolved: true
        text: |-
          {{ range .Alerts }}• [{{ or .Labels.namespace "unknown-namespace" }}/{{ or .Labels.job_name .Labels.job "unknown-job" }}] {{ .Annotations.summary }}
            Started: {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}{{ if eq .Status "resolved" }} | Ended: {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}{{ end }}
          {{ end }}
        title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
    route:
      group_by:
      - alertname
      - namespace
      - job_name
      group_interval: 5m
      group_wait: 30s
      receiver: slack
      repeat_interval: 4h
      routes:
      - match:
          alertname: Watchdog
        receiver: 'null'
      - match:
          alertname: KubeJobFailed
        receiver: slack
        group_interval: 30m
        repeat_interval: 8h
      - match_re:
          alertname: ^(CoreDNS.*|DNSResolutionFailing|KubePodCrashLooping)
        receiver: slack
  service:
    nodePort: 30093
    type: NodePort
grafana:
  persistence:
    annotations:
      "helm.sh/resource-policy": keep
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClassName: longhorn
  service:
    nodePort: 30000
    type: NodePort
  sidecar:
    datasources:
      defaultDatasourceEnabled: true
      enabled: true
      isDefaultDatasource: true
      uid: prometheus
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
  service:
    nodePort: 30090
    type: NodePort

additionalPrometheusRulesMap:
  coredns-rules:
    groups:
    - name: coredns
      interval: 30s
      rules:
      - alert: CoreDNSDown
        expr: sum(up{job="kube-dns"}) < 1
        for: 2m
        labels:
          severity: critical
          namespace: kube-system
          job_name: kube-dns
        annotations:
          summary: "CoreDNS is down"
          description: "CoreDNS has been down for more than 2 minutes."
      - alert: CoreDNSHighErrorRate
        expr: |
          (
            sum(increase(coredns_dns_responses_total{rcode="SERVFAIL"}[10m]))
              /
            clamp_min(sum(increase(coredns_dns_responses_total[10m])), 1)
          ) > 0.05
          and
          sum(increase(coredns_dns_responses_total[10m])) > 100
        for: 10m
        labels:
          severity: warning
          namespace: kube-system
          job_name: kube-dns
        annotations:
          summary: "CoreDNS high error rate"
          description: "CoreDNS SERVFAIL rate is > 5% over 10m with at least 100 DNS responses."
